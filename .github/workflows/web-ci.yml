name: Web CI

on:
  push:
    paths:
      - "web/**"
      - "Makefile"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "Makefile"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify
