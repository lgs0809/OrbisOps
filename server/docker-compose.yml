name: orbisops

services:
  mysql:
    image: mysql:8.4
    container_name: orbisops-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-orbisops}
      MYSQL_USER: ${MYSQL_USERNAME:-orbisops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - orbisops-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: orbisops-pgvector
    environment:
      POSTGRES_DB: ${PGVECTOR_DATABASE:-orbisops}
      POSTGRES_USER: ${PGVECTOR_USERNAME:-orbisops}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:?PGVECTOR_PASSWORD is required}
    ports:
      - "${PGVECTOR_PORT:-5432}:5432"
    volumes:
      - orbisops-pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    container_name: orbisops-redis
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - orbisops-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  orbisops-mysql-data:
  orbisops-pgvector-data:
  orbisops-redis-data:
