server:
  port: ${ORBISOPS_SERVER_PORT:8099}

# 线程池配置
orbisops:
  thread:
    pool:
      executor:
        config:
          core-pool-size: 20
          max-pool-size: 50
          keep-alive-time: 5000
          block-queue-size: 5000
          policy: CallerRunsPolicy

  # 数据库配置；启动时配置数据库资源信息

  admin:
    auth:
      jwt-secret: ${ORBISOPS_ADMIN_JWT_SECRET:}
      jwt-ttl-hours: ${ORBISOPS_ADMIN_JWT_TTL_HOURS:12}
      service-token: ${ORBISOPS_ADMIN_SERVICE_TOKEN:}
      revocation:
        jdbc-enabled: ${ORBISOPS_ADMIN_AUTH_REVOCATION_JDBC_ENABLED:true}
        auto-init: ${ORBISOPS_ADMIN_AUTH_REVOCATION_AUTO_INIT:true}

  task:
    job:
      enabled: true
      pool-size: 5
      thread-name-prefix: "orbisops-task-"
      wait-for-tasks-to-complete-on-shutdown: true
      await-termination-seconds: 30
      refresh-interval: 30000
      clean-invalid-tasks-cron: "0 0/5 * * * ?"

  safety:
    allow-in-memory-evidence-store: ${ORBISOPS_SAFETY_ALLOW_IN_MEMORY_EVIDENCE_STORE:false}
  intent:
    llm-classifier:
      enabled: ${ORBISOPS_INTENT_LLM_CLASSIFIER_ENABLED:true}
      min-confidence: ${ORBISOPS_INTENT_LLM_MIN_CONFIDENCE:0.65}
      context-message-limit: ${ORBISOPS_INTENT_CONTEXT_MESSAGE_LIMIT:6}
      context-max-chars: ${ORBISOPS_INTENT_CONTEXT_MAX_CHARS:4000}
  memory:
    auto-init: ${ORBISOPS_MEMORY_AUTO_INIT:true}
    max-injection-count: ${ORBISOPS_MEMORY_MAX_INJECTION_COUNT:8}
    default-ttl: ${ORBISOPS_MEMORY_DEFAULT_TTL:PT24H}
  evidence:
    auto-init: ${ORBISOPS_EVIDENCE_AUTO_INIT:true}
  task-context:
    auto-init: ${ORBISOPS_TASK_CONTEXT_AUTO_INIT:true}
  context-memory:
    auto-init: ${ORBISOPS_CONTEXT_MEMORY_AUTO_INIT:true}
  change-package:
    auto-init: ${ORBISOPS_CHANGE_PACKAGE_AUTO_INIT:true}
  approved-landing:
    enabled: ${ORBISOPS_APPROVED_LANDING_ENABLED:false}
    operation-lease-seconds: ${ORBISOPS_LANDING_OPERATION_LEASE_SECONDS:300}
    operation-heartbeat-seconds: ${ORBISOPS_LANDING_OPERATION_HEARTBEAT_SECONDS:30}
    recovery:
      enabled: ${ORBISOPS_LANDING_RECOVERY_ENABLED:true}
      fixed-delay-ms: ${ORBISOPS_LANDING_RECOVERY_FIXED_DELAY_MS:30000}
      batch-size: ${ORBISOPS_LANDING_RECOVERY_BATCH_SIZE:20}
  progressive-mcp:
    enforce-project-managed: ${ORBISOPS_PROGRESSIVE_MCP_ENFORCE_PROJECT_MANAGED:true}
    disclosure:
      enabled: ${ORBISOPS_PROGRESSIVE_MCP_DISCLOSURE_ENABLED:true}
  skill-evolver:
    auto-init: ${ORBISOPS_SKILL_EVOLVER_AUTO_INIT:true}
    trigger:
      enabled: ${ORBISOPS_SKILL_EVOLVER_TRIGGER_ENABLED:true}
    worker:
      enabled: ${ORBISOPS_SKILL_EVOLVER_WORKER_ENABLED:true}
      fixed-delay-ms: ${ORBISOPS_SKILL_EVOLVER_WORKER_FIXED_DELAY_MS:60000}
      batch-size: ${ORBISOPS_SKILL_EVOLVER_WORKER_BATCH_SIZE:5}
      max-attempts: ${ORBISOPS_SKILL_EVOLVER_WORKER_MAX_ATTEMPTS:3}
  skill-evolution:
    enabled: ${ORBISOPS_SKILL_EVOLUTION_ENABLED:true}
    shadow:
      enabled: ${ORBISOPS_SKILL_EVOLUTION_SHADOW_ENABLED:true}
      min-score: ${ORBISOPS_SKILL_EVOLUTION_SHADOW_MIN_SCORE:0.80}
    canary:
      enabled: ${ORBISOPS_SKILL_EVOLUTION_CANARY_ENABLED:true}
    canary-percent: ${ORBISOPS_SKILL_EVOLUTION_CANARY_PERCENT:10}
    min-sample-size: ${ORBISOPS_SKILL_EVOLUTION_MIN_SAMPLE_SIZE:10}
    similarity-threshold: ${ORBISOPS_SKILL_EVOLUTION_SIMILARITY_THRESHOLD:0.72}
    promotion:
      min-observations: ${ORBISOPS_SKILL_EVOLUTION_MIN_OBSERVATIONS:3}
      explicit-procedure-min-observations: ${ORBISOPS_SKILL_EVOLUTION_EXPLICIT_MIN_OBSERVATIONS:2}
      min-distinct-runs: ${ORBISOPS_SKILL_EVOLUTION_MIN_DISTINCT_RUNS:2}
      min-distinct-sessions: ${ORBISOPS_SKILL_EVOLUTION_MIN_DISTINCT_SESSIONS:2}
      consolidation-sample-limit: ${ORBISOPS_SKILL_EVOLUTION_CONSOLIDATION_SAMPLE_LIMIT:12}
    rollback-thresholds:
      blocked-tool-rate: ${ORBISOPS_SKILL_EVOLUTION_MAX_BLOCKED_RATE:0.25}
      needs-replan-rate: ${ORBISOPS_SKILL_EVOLUTION_MAX_REPLAN_RATE:0.30}
      negative-feedback-rate: ${ORBISOPS_SKILL_EVOLUTION_MAX_NEGATIVE_FEEDBACK_RATE:0.20}
      success-rate-drop: ${ORBISOPS_SKILL_EVOLUTION_MAX_SUCCESS_RATE_DROP:0.15}
      evidence-rate-drop: ${ORBISOPS_SKILL_EVOLUTION_MAX_EVIDENCE_RATE_DROP:0.15}
      tool-call-increase-rate: ${ORBISOPS_SKILL_EVOLUTION_MAX_TOOL_CALL_INCREASE_RATE:0.50}
  skill-runtime:
    retrieval:
      endpoint: ${ORBISOPS_SKILL_RETRIEVAL_ENDPOINT:}
      api-key: ${ORBISOPS_SKILL_RETRIEVAL_API_KEY:}
      embedding-revision: ${ORBISOPS_SKILL_EMBEDDING_REVISION:}
      reranker-revision: ${ORBISOPS_SKILL_RERANKER_REVISION:}
    catalog-candidate-limit: ${ORBISOPS_SKILL_RUNTIME_CATALOG_LIMIT:20}
    selected-limit: ${ORBISOPS_SKILL_RUNTIME_SELECTED_LIMIT:3}
    max-explicit-skills: ${ORBISOPS_SKILL_RUNTIME_MAX_EXPLICIT:3}
    min-relevance-score: ${ORBISOPS_SKILL_RUNTIME_MIN_RELEVANCE:0.12}
    similar-suppression-threshold: ${ORBISOPS_SKILL_RUNTIME_SIMILAR_THRESHOLD:0.88}
    semantic-enabled: ${ORBISOPS_SKILL_RUNTIME_SEMANTIC_ENABLED:true}
    semantic-candidate-limit: ${ORBISOPS_SKILL_RUNTIME_SEMANTIC_CANDIDATE_LIMIT:64}
    semantic-recall-limit: ${ORBISOPS_SKILL_RUNTIME_SEMANTIC_RECALL_LIMIT:20}
    semantic-weight: ${ORBISOPS_SKILL_RUNTIME_SEMANTIC_WEIGHT:0.42}
    category-boost: ${ORBISOPS_SKILL_RUNTIME_CATEGORY_BOOST:0.12}
    negative-penalty-weight: ${ORBISOPS_SKILL_RUNTIME_NEGATIVE_PENALTY_WEIGHT:0.65}
    llm-rerank-enabled: ${ORBISOPS_SKILL_RUNTIME_LLM_RERANK_ENABLED:true}
    llm-rerank-candidate-limit: ${ORBISOPS_SKILL_RUNTIME_LLM_RERANK_CANDIDATE_LIMIT:20}
    llm-rerank-weight: ${ORBISOPS_SKILL_RUNTIME_LLM_RERANK_WEIGHT:0.35}
    embedding-cache-size: ${ORBISOPS_SKILL_RUNTIME_EMBEDDING_CACHE_SIZE:2048}
    catalog-summary-max-chars: ${ORBISOPS_SKILL_RUNTIME_CATALOG_SUMMARY_MAX_CHARS:2500}
    max-single-skill-chars: ${ORBISOPS_SKILL_RUNTIME_MAX_SINGLE_SKILL_CHARS:4000}
  ai:
    model-calls-enabled: ${ORBISOPS_AI_MODEL_CALLS_ENABLED:true}
    placeholder-api-key: ${ORBISOPS_AI_PLACEHOLDER_API_KEY:dev-placeholder-key}
    local-model-readiness-cache-ms: ${ORBISOPS_AI_LOCAL_MODEL_READINESS_CACHE_MS:10000}
    local-model-readiness-timeout-ms: ${ORBISOPS_AI_LOCAL_MODEL_READINESS_TIMEOUT_MS:500}
  multi-agent:
    enabled: ${ORBISOPS_MULTI_AGENT_ENABLED:true}
    planner-mode: ${ORBISOPS_MULTI_AGENT_PLANNER_MODE:smart}
    planner-llm-enabled: ${ORBISOPS_PLANNER_LLM_ENABLED:true}
    main-reflection-llm-enabled: ${ORBISOPS_MAIN_REFLECTION_LLM_ENABLED:true}
    sub-agent-llm-enabled: ${ORBISOPS_SUB_AGENT_LLM_ENABLED:true}
    reflection-llm-enabled: ${ORBISOPS_REFLECTION_LLM_ENABLED:true}
    parallel-execution-enabled: ${ORBISOPS_PARALLEL_EXECUTION_ENABLED:true}
    skill-context-enabled: ${ORBISOPS_SKILL_CONTEXT_ENABLED:true}
    skill-context-mode: ${ORBISOPS_SKILL_CONTEXT_MODE:lazy}
    max-task-executions: ${ORBISOPS_MULTI_AGENT_MAX_TASK_EXECUTIONS:8}
    max-adjustments: ${ORBISOPS_MULTI_AGENT_MAX_ADJUSTMENTS:3}
    max-evidence-items: ${ORBISOPS_MULTI_AGENT_MAX_EVIDENCE_ITEMS:12}
    skill-context-max-chars: ${ORBISOPS_SKILL_CONTEXT_MAX_CHARS:12000}
    max-output-chars: ${ORBISOPS_MAX_OUTPUT_CHARS:6000}
    model-call-timeout-seconds: ${ORBISOPS_MODEL_CALL_TIMEOUT_SECONDS:240}
    fail-on-llm-degradation: ${ORBISOPS_FAIL_ON_LLM_DEGRADATION:true}
    json-repair-retry-enabled: ${ORBISOPS_JSON_REPAIR_RETRY_ENABLED:true}
    json-response-format-enabled: ${ORBISOPS_JSON_RESPONSE_FORMAT_ENABLED:true}
    json-max-completion-tokens: ${ORBISOPS_JSON_MAX_COMPLETION_TOKENS:1200}
    json-skill-context-retry-enabled: ${ORBISOPS_JSON_SKILL_CONTEXT_RETRY_ENABLED:true}
    json-skill-context-retry-max-chars: ${ORBISOPS_JSON_SKILL_CONTEXT_RETRY_MAX_CHARS:16000}
    final-report-llm-enabled: ${ORBISOPS_FINAL_REPORT_LLM_ENABLED:true}
    final-report-max-chars: ${ORBISOPS_FINAL_REPORT_MAX_CHARS:8000}
    executor:
      core-pool-size: ${ORBISOPS_SUB_AGENT_CORE_POOL_SIZE:3}
      max-pool-size: ${ORBISOPS_SUB_AGENT_MAX_POOL_SIZE:6}
      queue-capacity: ${ORBISOPS_SUB_AGENT_QUEUE_CAPACITY:32}
      keep-alive-seconds: ${ORBISOPS_SUB_AGENT_KEEP_ALIVE_SECONDS:30}
      rejection-policy: ${ORBISOPS_SUB_AGENT_REJECTION_POLICY:CallerRunsPolicy}
    run-executor:
      core-pool-size: ${ORBISOPS_RUN_CORE_POOL_SIZE:2}
      max-pool-size: ${ORBISOPS_RUN_MAX_POOL_SIZE:4}
      queue-capacity: ${ORBISOPS_RUN_QUEUE_CAPACITY:32}
      keep-alive-seconds: ${ORBISOPS_RUN_KEEP_ALIVE_SECONDS:30}
      rejection-policy: ${ORBISOPS_RUN_REJECTION_POLICY:CallerRunsPolicy}
    model-call-executor:
      core-pool-size: ${ORBISOPS_MODEL_CALL_CORE_POOL_SIZE:4}
      max-pool-size: ${ORBISOPS_MODEL_CALL_MAX_POOL_SIZE:8}
      queue-capacity: ${ORBISOPS_MODEL_CALL_QUEUE_CAPACITY:32}
      keep-alive-seconds: ${ORBISOPS_MODEL_CALL_KEEP_ALIVE_SECONDS:30}
      rejection-policy: ${ORBISOPS_MODEL_CALL_REJECTION_POLICY:AbortPolicy}
  graph-events:
    max-memory-events: ${ORBISOPS_GRAPH_EVENTS_MAX_MEMORY_EVENTS:500}
    jdbc-enabled: ${ORBISOPS_GRAPH_EVENTS_JDBC_ENABLED:true}
    auto-init: ${ORBISOPS_GRAPH_EVENTS_AUTO_INIT:true}
  agents:
    locations: classpath*:/agents/ops/*.yml,classpath*:/agents/ops/*.yaml
    default-agent-id: ${ORBISOPS_AGENT_DEFAULT_ID:generic-ops-react-agent}
    jdbc-enabled: ${ORBISOPS_AGENT_DEFINITION_JDBC_ENABLED:true}
    auto-init: ${ORBISOPS_AGENT_DEFINITION_AUTO_INIT:true}
  agent:
    action-mode: ${ORBISOPS_AGENT_ACTION_MODE:analysis-only}
    enforce-read-only-tools: ${ORBISOPS_AGENT_ENFORCE_READ_ONLY_TOOLS:true}
  chat:
    stream:
      timeout-ms: ${ORBISOPS_CHAT_STREAM_TIMEOUT_MS:360000}
    memory:
      enabled: ${ORBISOPS_CHAT_MEMORY_ENABLED:true}
      jdbc-enabled: ${ORBISOPS_CHAT_MEMORY_JDBC_ENABLED:true}
      auto-init: ${ORBISOPS_CHAT_MEMORY_AUTO_INIT:true}
      hot-store: ${ORBISOPS_CHAT_MEMORY_HOT_STORE:memory}
      hot-max-messages: ${ORBISOPS_CHAT_MEMORY_HOT_MAX_MESSAGES:12}
      hot-buffer-messages: ${ORBISOPS_CHAT_MEMORY_HOT_BUFFER_MESSAGES:24}
      hot-ttl-minutes: ${ORBISOPS_CHAT_MEMORY_HOT_TTL_MINUTES:30}
      item-match-limit: ${ORBISOPS_CHAT_MEMORY_ITEM_MATCH_LIMIT:8}
      semantic-enabled: ${ORBISOPS_CHAT_MEMORY_SEMANTIC_ENABLED:true}
      semantic-top-k: ${ORBISOPS_CHAT_MEMORY_SEMANTIC_TOP_K:8}
      context-max-chars: ${ORBISOPS_CHAT_MEMORY_CONTEXT_MAX_CHARS:8000}
      assemble-timeout-millis: ${ORBISOPS_CHAT_MEMORY_ASSEMBLE_TIMEOUT_MILLIS:1200}
      recency-aware-enabled: ${ORBISOPS_CHAT_MEMORY_RECENCY_AWARE_ENABLED:true}
      recency-half-life-turns: ${ORBISOPS_CHAT_MEMORY_RECENCY_HALF_LIFE_TURNS:6}
      extraction-enabled: ${ORBISOPS_CHAT_MEMORY_EXTRACTION_ENABLED:true}
      llm-extraction-enabled: ${ORBISOPS_CHAT_MEMORY_LLM_EXTRACTION_ENABLED:true}
      llm-extraction-max-input-chars: ${ORBISOPS_CHAT_MEMORY_LLM_EXTRACTION_MAX_INPUT_CHARS:4000}
      extraction-max-items-per-message: ${ORBISOPS_CHAT_MEMORY_EXTRACTION_MAX_ITEMS_PER_MESSAGE:6}
      compression-enabled: ${ORBISOPS_CHAT_MEMORY_COMPRESSION_ENABLED:true}
      compression-hot-threshold-messages: ${ORBISOPS_CHAT_MEMORY_COMPRESSION_HOT_THRESHOLD_MESSAGES:20}
      compression-keep-recent: ${ORBISOPS_CHAT_MEMORY_COMPRESSION_KEEP_RECENT:8}
      compression-llm-enabled: ${ORBISOPS_CHAT_MEMORY_COMPRESSION_LLM_ENABLED:true}
      compression-llm-max-input-chars: ${ORBISOPS_CHAT_MEMORY_COMPRESSION_LLM_MAX_INPUT_CHARS:6000}
      executor:
        core-pool-size: ${ORBISOPS_CHAT_MEMORY_CORE_POOL_SIZE:3}
        max-pool-size: ${ORBISOPS_CHAT_MEMORY_MAX_POOL_SIZE:5}
        queue-capacity: ${ORBISOPS_CHAT_MEMORY_QUEUE_CAPACITY:64}
        keep-alive-seconds: ${ORBISOPS_CHAT_MEMORY_KEEP_ALIVE_SECONDS:30}
        rejection-policy: ${ORBISOPS_CHAT_MEMORY_REJECTION_POLICY:CallerRunsPolicy}
  skills:
    enabled: true
    locations: classpath:/skills
    editable-location: ${ORBISOPS_SKILLS_EDITABLE_LOCATION:./data/skills}
    editable-auto-init: true
  mcp:
    cache:
      ttl-seconds: ${ORBISOPS_MCP_CACHE_TTL_SECONDS:600}
    security:
      enabled: ${ORBISOPS_MCP_SECURITY_ENABLED:true}
      allowed-transports: ${ORBISOPS_MCP_ALLOWED_TRANSPORTS:stdio,sse,streamable-http}
      allowed-stdio-commands: ${ORBISOPS_MCP_ALLOWED_STDIO_COMMANDS:npx,node,python,python3,uvx,java}
      allowed-sse-hosts: ${ORBISOPS_MCP_ALLOWED_SSE_HOSTS:127.0.0.1,localhost}
      allowed-env-keys: ${ORBISOPS_MCP_ALLOWED_ENV_KEYS:ES_API_KEY,MYSQL_PASSWORD,POSTGRES_PASSWORD,REDIS_PASSWORD,PROMETHEUS_PASSWORD,RABBITMQ_PASSWORD}
      allowed-header-keys: ${ORBISOPS_MCP_ALLOWED_HEADER_KEYS:Authorization,X-API-Key,X-Ops-Execution-Key,X-Ops-Fencing-Token,X-Ops-Deadline}
      max-timeout-seconds: ${ORBISOPS_MCP_MAX_TIMEOUT_SECONDS:60}
  elasticsearch-url: http://127.0.0.1:9200
  elasticsearch-index: ${ORBISOPS_ES_INDEX:}
  elasticsearch-timeout-seconds: ${ORBISOPS_ES_TIMEOUT_SECONDS:5}
  elasticsearch-sample-size: ${ORBISOPS_ES_SAMPLE_SIZE:8}
  prometheus-url: http://127.0.0.1:9090
  prometheus-job: ${ORBISOPS_PROMETHEUS_JOB:}
  prometheus-timeout-seconds: ${ORBISOPS_PROMETHEUS_TIMEOUT_SECONDS:5}
  mysql-slow-sql:
    enabled: ${ORBISOPS_MYSQL_SLOW_SQL_ENABLED:true}
    sample-size: ${ORBISOPS_MYSQL_SLOW_SQL_SAMPLE_SIZE:10}
    threshold-ms: ${ORBISOPS_MYSQL_SLOW_SQL_THRESHOLD_MS:500}
    performance-schema-fallback: ${ORBISOPS_MYSQL_SLOW_SQL_PERF_SCHEMA_FALLBACK:true}
  allowed-origin-patterns: ${ORBISOPS_ALLOWED_ORIGIN_PATTERNS:http://127.0.0.1:3000,http://localhost:3000}
  audit:
    max-records: ${ORBISOPS_AUDIT_MAX_RECORDS:200}
    jdbc-enabled: ${ORBISOPS_AUDIT_JDBC_ENABLED:true}
    auto-init: ${ORBISOPS_AUDIT_AUTO_INIT:true}
  runs:
    max-memory-records: ${ORBISOPS_RUN_MAX_MEMORY_RECORDS:200}
    jdbc-enabled: ${ORBISOPS_RUN_JDBC_ENABLED:true}
    auto-init: ${ORBISOPS_RUN_AUTO_INIT:true}
    reject-when-queue-full: ${ORBISOPS_RUN_REJECT_WHEN_QUEUE_FULL:true}
    allow-in-memory-fallback: ${ORBISOPS_RUN_ALLOW_IN_MEMORY_FALLBACK:false}
  source-repository:
    enabled: ${ORBISOPS_SOURCE_REPOSITORY_ENABLED:true}
    jdbc-enabled: ${ORBISOPS_SOURCE_REPOSITORY_JDBC_ENABLED:true}
    auto-init: ${ORBISOPS_SOURCE_REPOSITORY_AUTO_INIT:true}
    allowed-local-roots: ${ORBISOPS_SOURCE_ALLOWED_LOCAL_ROOTS:${user.dir}/..}
    git-binary: ${ORBISOPS_SOURCE_GIT_BINARY:git}
    command-timeout-seconds: ${ORBISOPS_SOURCE_COMMAND_TIMEOUT_SECONDS:8}
    max-file-bytes: ${ORBISOPS_SOURCE_MAX_FILE_BYTES:1048576}
    max-command-output-bytes: ${ORBISOPS_SOURCE_MAX_COMMAND_OUTPUT_BYTES:2097152}
  execution-resource:
    enabled: ${ORBISOPS_EXECUTION_RESOURCE_ENABLED:true}
    jdbc-enabled: ${ORBISOPS_EXECUTION_RESOURCE_JDBC_ENABLED:true}
    auto-init: ${ORBISOPS_EXECUTION_RESOURCE_AUTO_INIT:true}
  model-api-bootstrap:
    enabled: ${ORBISOPS_MODEL_API_BOOTSTRAP_ENABLED:true}
    api-id: ${ORBISOPS_MODEL_API_BOOTSTRAP_API_ID:1001}
  repair:
    enabled: ${ORBISOPS_REPAIR_ENABLED:true}
    jdbc-enabled: ${ORBISOPS_REPAIR_JDBC_ENABLED:true}
    auto-init: ${ORBISOPS_REPAIR_AUTO_INIT:true}
    worktree-root: ${ORBISOPS_REPAIR_WORKTREE_ROOT:${ORBISOPS_REPAIR_SANDBOX_ROOT:${user.dir}/../.ops-repair/worktrees}}
    artifact-root: ${ORBISOPS_REPAIR_ARTIFACT_ROOT:${user.dir}/../.ops-repair/artifacts}
    release-root: ${ORBISOPS_REPAIR_RELEASE_ROOT:${user.dir}/../.ops-repair/releases}
    command-timeout-seconds: ${ORBISOPS_REPAIR_COMMAND_TIMEOUT_SECONDS:900}
    max-log-bytes: ${ORBISOPS_REPAIR_MAX_LOG_BYTES:1048576}
    runner: ${ORBISOPS_REPAIR_RUNNER:docker}
    docker:
      binary: ${ORBISOPS_REPAIR_DOCKER_BINARY:docker}
      maven-image: ${ORBISOPS_REPAIR_DOCKER_MAVEN_IMAGE:maven:3.9.9-eclipse-temurin-17}
      node-image: ${ORBISOPS_REPAIR_DOCKER_NODE_IMAGE:node:20-bookworm-slim}
      make-image: ${ORBISOPS_REPAIR_DOCKER_MAKE_IMAGE:buildpack-deps:bookworm}
    github:
      enabled: ${ORBISOPS_REPAIR_GITHUB_ENABLED:false}
      repository: ${ORBISOPS_REPAIR_GITHUB_REPOSITORY:}
      api-url: ${ORBISOPS_REPAIR_GITHUB_API_URL:https://api.github.com}
      token-ref: ${ORBISOPS_REPAIR_GITHUB_TOKEN_REF:}
      remote: ${ORBISOPS_REPAIR_GITHUB_REMOTE:origin}
  alert-triggers:
    auto-init: ${ORBISOPS_ALERT_TRIGGER_AUTO_INIT:true}
    signature-max-skew-seconds: ${ORBISOPS_ALERT_TRIGGER_SIGNATURE_MAX_SKEW_SECONDS:300}
    aggregation:
      debounce-seconds: ${ORBISOPS_ALERT_AGGREGATION_DEBOUNCE_SECONDS:120}
      max-wait-seconds: ${ORBISOPS_ALERT_AGGREGATION_MAX_WAIT_SECONDS:900}
    project-queue:
      max-queued: ${ORBISOPS_ALERT_PROJECT_MAX_QUEUED:100}
      max-running: ${ORBISOPS_ALERT_PROJECT_MAX_RUNNING:4}
    outbox:
      enabled: ${ORBISOPS_ALERT_TRIGGER_OUTBOX_ENABLED:true}
      fixed-delay-ms: ${ORBISOPS_ALERT_TRIGGER_OUTBOX_FIXED_DELAY_MS:30000}
      batch-size: ${ORBISOPS_ALERT_TRIGGER_OUTBOX_BATCH_SIZE:20}
      max-attempts: ${ORBISOPS_ALERT_TRIGGER_OUTBOX_MAX_ATTEMPTS:8}
      lock-timeout-seconds: ${ORBISOPS_ALERT_TRIGGER_OUTBOX_LOCK_TIMEOUT_SECONDS:120}
  channel:
    inbound:
      max-message-chars: ${ORBISOPS_CHANNEL_INBOUND_MAX_MESSAGE_CHARS:12000}
      max-metadata-chars: ${ORBISOPS_CHANNEL_INBOUND_MAX_METADATA_CHARS:8192}
      lease-seconds: ${ORBISOPS_CHANNEL_INBOUND_LEASE_SECONDS:300}
      worker:
        enabled: ${ORBISOPS_CHANNEL_INBOUND_WORKER_ENABLED:true}
        fixed-delay-ms: ${ORBISOPS_CHANNEL_INBOUND_WORKER_FIXED_DELAY_MS:5000}
        batch-size: ${ORBISOPS_CHANNEL_INBOUND_WORKER_BATCH_SIZE:20}
    outbound:
      max-message-chars: ${ORBISOPS_CHANNEL_OUTBOUND_MAX_MESSAGE_CHARS:20000}
    auto-init: ${ORBISOPS_CHANNEL_AUTO_INIT:true}
    webhook:
      max-clock-skew-seconds: ${ORBISOPS_CHANNEL_WEBHOOK_MAX_CLOCK_SKEW_SECONDS:300}
      allow-loopback: ${ORBISOPS_CHANNEL_WEBHOOK_ALLOW_LOOPBACK:true}
      allowed-hosts: ${ORBISOPS_CHANNEL_WEBHOOK_ALLOWED_HOSTS:}
    notification:
      max-message-chars: ${ORBISOPS_CHANNEL_NOTIFICATION_MAX_MESSAGE_CHARS:12000}
      outbox:
        auto-init: ${ORBISOPS_CHANNEL_NOTIFICATION_OUTBOX_AUTO_INIT:true}
        scheduler-enabled: ${ORBISOPS_CHANNEL_NOTIFICATION_OUTBOX_SCHEDULER_ENABLED:true}
        batch-size: ${ORBISOPS_CHANNEL_NOTIFICATION_OUTBOX_BATCH_SIZE:20}
        fixed-delay-ms: ${ORBISOPS_CHANNEL_NOTIFICATION_OUTBOX_FIXED_DELAY_MS:60000}
        max-attempts: ${ORBISOPS_CHANNEL_NOTIFICATION_OUTBOX_MAX_ATTEMPTS:8}
        lease-seconds: ${ORBISOPS_CHANNEL_NOTIFICATION_OUTBOX_LEASE_SECONDS:120}
  rag:
    vector-table-name: ${ORBISOPS_RAG_VECTOR_TABLE_NAME:orbisops_vector_store}
    vector-index:
      auto-init: ${ORBISOPS_RAG_VECTOR_INDEX_AUTO_INIT:true}
    query-rewrite:
      mode: ${ORBISOPS_RAG_QUERY_REWRITE_MODE:hybrid}
      llm-enabled: ${ORBISOPS_RAG_QUERY_REWRITE_LLM_ENABLED:true}
      base-url: ${ORBISOPS_RAG_QUERY_REWRITE_BASE_URL:${spring.ai.openai.base-url}}
      api-key: ${ORBISOPS_RAG_QUERY_REWRITE_API_KEY:${spring.ai.openai.api-key}}
      path: ${ORBISOPS_RAG_QUERY_REWRITE_PATH:v1/chat/completions}
      model: ${ORBISOPS_RAG_QUERY_REWRITE_MODEL:${spring.ai.openai.chat.options.model:unconfigured}}
      max-queries: ${ORBISOPS_RAG_QUERY_REWRITE_MAX_QUERIES:4}
      timeout-seconds: ${ORBISOPS_RAG_QUERY_REWRITE_TIMEOUT_SECONDS:45}
      min-chars: ${ORBISOPS_RAG_QUERY_REWRITE_MIN_CHARS:18}
      on-low-recall: ${ORBISOPS_RAG_QUERY_REWRITE_ON_LOW_RECALL:true}
      low-recall-min-candidates: ${ORBISOPS_RAG_QUERY_REWRITE_LOW_RECALL_MIN_CANDIDATES:2}
    ttft:
      optimize-streaming: ${ORBISOPS_RAG_TTFT_OPTIMIZE_STREAMING:true}
      disable-rerank-on-stream: ${ORBISOPS_RAG_TTFT_DISABLE_RERANK_ON_STREAM:true}
      vector-top-k: ${ORBISOPS_RAG_TTFT_VECTOR_TOP_K:4}
      bm25-top-k: ${ORBISOPS_RAG_TTFT_BM25_TOP_K:6}
      final-top-k: ${ORBISOPS_RAG_TTFT_FINAL_TOP_K:4}
      query-rewrite-enabled: ${ORBISOPS_RAG_TTFT_QUERY_REWRITE_ENABLED:true}
    ingestion:
      jdbc-enabled: ${ORBISOPS_RAG_INGESTION_JDBC_ENABLED:true}
      auto-init: ${ORBISOPS_RAG_INGESTION_AUTO_INIT:true}
      max-file-count: ${ORBISOPS_RAG_INGESTION_MAX_FILE_COUNT:20}
      max-file-bytes: ${ORBISOPS_RAG_INGESTION_MAX_FILE_BYTES:52428800}
      max-total-bytes: ${ORBISOPS_RAG_INGESTION_MAX_TOTAL_BYTES:209715200}
      allowed-extensions: ${ORBISOPS_RAG_INGESTION_ALLOWED_EXTENSIONS:md,markdown,pdf}
      allowed-content-types: ${ORBISOPS_RAG_INGESTION_ALLOWED_CONTENT_TYPES:text/markdown,text/plain,application/pdf,application/octet-stream}
      executor:
        core-pool-size: ${ORBISOPS_RAG_INGESTION_CORE_POOL_SIZE:1}
        max-pool-size: ${ORBISOPS_RAG_INGESTION_MAX_POOL_SIZE:2}
        queue-capacity: ${ORBISOPS_RAG_INGESTION_QUEUE_CAPACITY:16}
        keep-alive-seconds: ${ORBISOPS_RAG_INGESTION_KEEP_ALIVE_SECONDS:30}
        rejection-policy: ${ORBISOPS_RAG_INGESTION_REJECTION_POLICY:CallerRunsPolicy}
    multimodal:
      enabled: ${ORBISOPS_RAG_MULTIMODAL_ENABLED:false}
      provider: ${ORBISOPS_RAG_MULTIMODAL_PROVIDER:}
      base-url: ${ORBISOPS_RAG_MULTIMODAL_BASE_URL:}
      api-key: ${ORBISOPS_RAG_MULTIMODAL_API_KEY:}
      path: ${ORBISOPS_RAG_MULTIMODAL_PATH:v1/multimodalembeddings}
      model: ${ORBISOPS_RAG_MULTIMODAL_MODEL:unconfigured}
      table-name: ${ORBISOPS_RAG_MULTIMODAL_TABLE_NAME:orbisops_multimodal_vectors}
      dimension: ${ORBISOPS_RAG_MULTIMODAL_DIMENSION:2048}
      auto-init: ${ORBISOPS_RAG_MULTIMODAL_AUTO_INIT:true}
      index-text-documents: ${ORBISOPS_RAG_MULTIMODAL_INDEX_TEXT_DOCUMENTS:false}
      index-original-media: ${ORBISOPS_RAG_MULTIMODAL_INDEX_ORIGINAL_MEDIA:true}
      index-pdf-page-images: ${ORBISOPS_RAG_MULTIMODAL_INDEX_PDF_PAGE_IMAGES:true}
      max-pdf-pages: ${ORBISOPS_RAG_MULTIMODAL_MAX_PDF_PAGES:3}
      pdf-render-dpi: ${ORBISOPS_RAG_MULTIMODAL_PDF_RENDER_DPI:144}
      max-image-bytes: ${ORBISOPS_RAG_MULTIMODAL_MAX_IMAGE_BYTES:20971520}
      max-text-chars: ${ORBISOPS_RAG_MULTIMODAL_MAX_TEXT_CHARS:3000}
      search-top-k: ${ORBISOPS_RAG_MULTIMODAL_SEARCH_TOP_K:8}
      timeout-seconds: ${ORBISOPS_RAG_MULTIMODAL_TIMEOUT_SECONDS:30}
      max-retries: ${ORBISOPS_RAG_MULTIMODAL_MAX_RETRIES:1}
    parse:
      max-chunk-chars: ${ORBISOPS_RAG_PARSE_MAX_CHUNK_CHARS:3000}
      visual-min-text-chars: ${ORBISOPS_RAG_PARSE_VISUAL_MIN_TEXT_CHARS:120}
      media-storage-dir: ${ORBISOPS_RAG_PARSE_MEDIA_STORAGE_DIR:data/rag-media}
      max-pdf-images: ${ORBISOPS_RAG_PARSE_MAX_PDF_IMAGES:20}
      visual:
        enabled: ${ORBISOPS_RAG_VISUAL_ENABLED:false}
        high-value-only: ${ORBISOPS_RAG_VISUAL_HIGH_VALUE_ONLY:true}
        provider: ${ORBISOPS_RAG_VISUAL_PROVIDER:openai}
        base-url: ${ORBISOPS_RAG_VISUAL_BASE_URL:${spring.ai.openai.base-url}}
        api-key: ${ORBISOPS_RAG_VISUAL_API_KEY:${spring.ai.openai.api-key}}
        path: ${ORBISOPS_RAG_VISUAL_PATH:v1/chat/completions}
        model: ${ORBISOPS_RAG_VISUAL_MODEL:${spring.ai.openai.chat.options.model:unconfigured}}
        detail: ${ORBISOPS_RAG_VISUAL_DETAIL:low}
        timeout-seconds: ${ORBISOPS_RAG_VISUAL_TIMEOUT_SECONDS:30}
        max-completion-tokens: ${ORBISOPS_RAG_VISUAL_MAX_COMPLETION_TOKENS:1200}
        token-limit-field: ${ORBISOPS_RAG_VISUAL_TOKEN_LIMIT_FIELD:max_completion_tokens}
        response-format: ${ORBISOPS_RAG_VISUAL_RESPONSE_FORMAT:json_schema}
        max-retries: ${ORBISOPS_RAG_VISUAL_MAX_RETRIES:1}
        max-images-per-document: ${ORBISOPS_RAG_VISUAL_MAX_IMAGES_PER_DOCUMENT:3}
        max-image-bytes: ${ORBISOPS_RAG_VISUAL_MAX_IMAGE_BYTES:4194304}
        pdf-render-dpi: ${ORBISOPS_RAG_VISUAL_PDF_RENDER_DPI:144}
    rerank:
      enabled: true
      provider: ${ORBISOPS_RERANK_PROVIDER:}
      base-url: ${ORBISOPS_RERANK_BASE_URL:}
      api-key: ${ORBISOPS_RERANK_API_KEY:}
      path: ${ORBISOPS_RERANK_PATH:v1/rerank}
      model: ${ORBISOPS_RERANK_MODEL:unconfigured}
      candidate-top-k: ${ORBISOPS_RERANK_CANDIDATE_TOP_K:20}
      top-n: 6
      max-doc-chars: ${ORBISOPS_RERANK_MAX_DOC_CHARS:1200}

spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  data:
    redis:
      host: ${ORBISOPS_REDIS_HOST:127.0.0.1}
      port: ${ORBISOPS_REDIS_PORT:6379}
      password: ${ORBISOPS_REDIS_PASSWORD:}
      timeout: ${ORBISOPS_REDIS_TIMEOUT:2s}
  datasource:
    mysql:
      username: ${ORBISOPS_MYSQL_USERNAME:orbisops}
      password: ${ORBISOPS_MYSQL_PASSWORD:}
      url: ${ORBISOPS_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/orbisops?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
      driver-class-name: com.mysql.cj.jdbc.Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        pool-name: OrbisOps_HikariCP
        minimum-idle: 15 #最小空闲连接数量
        idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
        maximum-pool-size: 25 #连接池最大连接数，默认是10
        auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
        max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
        connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
        connection-test-query: SELECT 1
    pgvector:
      driver-class-name: org.postgresql.Driver
      username: ${ORBISOPS_PGVECTOR_USERNAME:orbisops}
      password: ${ORBISOPS_PGVECTOR_PASSWORD:}
      url: ${ORBISOPS_PGVECTOR_URL:jdbc:postgresql://127.0.0.1:5432/orbisops}
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        maximum-pool-size: 5
        minimum-idle: 2
        idle-timeout: 30000
        connection-timeout: 30000
  ai:
    retry:
      max-attempts: ${ORBISOPS_SPRING_AI_RETRY_MAX_ATTEMPTS:2}
      backoff:
        initial-interval: ${ORBISOPS_SPRING_AI_RETRY_BACKOFF_INITIAL_INTERVAL:500ms}
        max-interval: ${ORBISOPS_SPRING_AI_RETRY_BACKOFF_MAX_INTERVAL:2s}
        multiplier: ${ORBISOPS_SPRING_AI_RETRY_BACKOFF_MULTIPLIER:2}
    openai:
      base-url: ${ORBISOPS_MODEL_BASE_URL:https://model-provider.invalid}
      api-key: ${ORBISOPS_MODEL_API_KEY:placeholder}
      embedding:
        base-url: ${ORBISOPS_EMBEDDING_BASE_URL:https://embedding-provider.invalid}
        api-key: ${ORBISOPS_EMBEDDING_API_KEY:placeholder}
        options:
          model: ${ORBISOPS_EMBEDDING_MODEL:unconfigured}
          dimensions: ${ORBISOPS_EMBEDDING_DIMENSIONS:1536}
      chat:
        connect-timeout-seconds: ${ORBISOPS_OPENAI_CHAT_CONNECT_TIMEOUT_SECONDS:5}
        read-timeout-seconds: ${ORBISOPS_OPENAI_CHAT_READ_TIMEOUT_SECONDS:45}
        options:
          model: ${ORBISOPS_CHAT_MODEL:unconfigured}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      show-components: always
  metrics:
    tags:
      application: orbisops

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml
