name: Server CI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "server/**"
      - "Makefile"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "Makefile"
      - ".github/workflows/server-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Repository release hygiene
        working-directory: ${{ github.workspace }}
        run: python3 scripts/release-hygiene.py

      - name: Check migration script
        run: bash -n scripts/db-migrate.sh

      - name: Check bundled MCP servers
        run: |
          for file in scripts/mcp/*.mjs; do
            node --check "$file"
          done

      - name: Test
        run: mvn -B test

      - name: Retain failed test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports-${{ github.run_id }}
          path: server/**/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Package
        run: mvn -B -DskipTests package

      - name: Build container image
        run: docker build --load -t orbisops/server:ci -f orbisops-app/Dockerfile .

      - name: Smoke container runtime dependencies
        run: |
          docker run --rm --entrypoint sh orbisops/server:ci -c '
            test "$(id -u)" = "10001" &&
            test -w /var/lib/orbisops/repair &&
            test -f /opt/orbisops/scripts/mcp/mysql-readonly-mcp-server.mjs &&
            node --check /opt/orbisops/scripts/mcp/mysql-readonly-mcp-server.mjs &&
            git --version && mysql --version && psql --version
          '
