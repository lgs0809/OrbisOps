name: orbisops-web

services:
  orbisops-web:
    image: nginx:1.25.1
    container_name: orbisops-web-app
    ports:
      - "3002:80"
    restart: unless-stopped
    networks:
      - orbisops-web-network
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - NODE_ENV=production

networks:
  orbisops-web-network:
    driver: bridge
    name: orbisops-web-network
