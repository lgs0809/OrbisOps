server:
  port: ${SERVER_PORT:8099}

thread:
  pool:
    executor:
      config:
        core-pool-size: ${THREAD_POOL_CORE_SIZE:20}
        max-pool-size: ${THREAD_POOL_MAX_SIZE:50}
        keep-alive-time: ${THREAD_POOL_KEEP_ALIVE_TIME:5000}
        block-queue-size: ${THREAD_POOL_QUEUE_SIZE:5000}
        policy: ${THREAD_POOL_REJECTION_POLICY:CallerRunsPolicy}

spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  datasource:
    mysql:
      username: ${MYSQL_USERNAME:orbisops}
      password: ${MYSQL_PASSWORD}
      url: ${MYSQL_URL}
      driver-class-name: ${MYSQL_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        pool-name: OrbisOps_HikariCP
        minimum-idle: ${MYSQL_POOL_MIN_IDLE:5}
        idle-timeout: ${MYSQL_POOL_IDLE_TIMEOUT:180000}
        maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:25}
        auto-commit: true
        max-lifetime: ${MYSQL_POOL_MAX_LIFETIME:1800000}
        connection-timeout: ${MYSQL_POOL_CONNECTION_TIMEOUT:30000}
        connection-test-query: SELECT 1
    pgvector:
      driver-class-name: ${PGVECTOR_DRIVER_CLASS_NAME:org.postgresql.Driver}
      username: ${PGVECTOR_USERNAME:orbisops}
      password: ${PGVECTOR_PASSWORD}
      url: ${PGVECTOR_URL}
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        maximum-pool-size: ${PGVECTOR_POOL_MAX_SIZE:5}
        minimum-idle: ${PGVECTOR_POOL_MIN_IDLE:2}
        idle-timeout: ${PGVECTOR_POOL_IDLE_TIMEOUT:30000}
        connection-timeout: ${PGVECTOR_POOL_CONNECTION_TIMEOUT:30000}
  ai:
    retry:
      max-attempts: ${SPRING_AI_RETRY_MAX_ATTEMPTS:2}
      backoff:
        initial-interval: ${SPRING_AI_RETRY_BACKOFF_INITIAL_INTERVAL:500ms}
        max-interval: ${SPRING_AI_RETRY_BACKOFF_MAX_INTERVAL:2s}
        multiplier: ${SPRING_AI_RETRY_BACKOFF_MULTIPLIER:2}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY}
      embedding:
        base-url: ${OPENAI_EMBEDDING_BASE_URL:http://127.0.0.1:8110}
        api-key: ${OPENAI_EMBEDDING_API_KEY:}
        options:
          model: ${OPENAI_EMBEDDING_MODEL:Qwen/Qwen3-VL-Embedding-2B}
          dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:2048}
      chat:
        connect-timeout-seconds: ${OPENAI_CHAT_CONNECT_TIMEOUT_SECONDS:5}
        read-timeout-seconds: ${OPENAI_CHAT_READ_TIMEOUT_SECONDS:45}
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-5.4-mini}

admin:
  auth:
    jwt-secret: ${ADMIN_JWT_SECRET}
    jwt-ttl-hours: ${ADMIN_JWT_TTL_HOURS:12}
    service-token: ${ADMIN_SERVICE_TOKEN:}
    reject-weak-secrets: ${ADMIN_AUTH_REJECT_WEAK_SECRETS:true}
    password-min-length: ${ADMIN_AUTH_PASSWORD_MIN_LENGTH:8}
    allow-prehashed-passwords: ${ADMIN_AUTH_ALLOW_PREHASHED_PASSWORDS:false}
    revocation:
      jdbc-enabled: ${ADMIN_AUTH_REVOCATION_JDBC_ENABLED:true}
      auto-init: ${ADMIN_AUTH_REVOCATION_AUTO_INIT:false}

orbisops:
  bootstrap:
    admin:
      enabled: ${ORBISOPS_BOOTSTRAP_ADMIN_ENABLED:false}
      user-id: ${ORBISOPS_BOOTSTRAP_ADMIN_USER_ID:bootstrap-admin}
      username: ${ORBISOPS_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${ORBISOPS_BOOTSTRAP_ADMIN_PASSWORD:}
  task:
    job:
      enabled: ${ORBISOPS_TASK_JOB_ENABLED:true}
      pool-size: ${ORBISOPS_TASK_POOL_SIZE:5}
      thread-name-prefix: ${ORBISOPS_TASK_THREAD_NAME_PREFIX:orbisops-task-}
      wait-for-tasks-to-complete-on-shutdown: true
      await-termination-seconds: ${ORBISOPS_TASK_AWAIT_TERMINATION_SECONDS:30}
      refresh-interval: ${ORBISOPS_TASK_REFRESH_INTERVAL:30000}
      clean-invalid-tasks-cron: ${ORBISOPS_TASK_CLEAN_INVALID_CRON:0 0/5 * * * ?}

ops:
  safety:
    allow-in-memory-evidence-store: ${OPS_SAFETY_ALLOW_IN_MEMORY_EVIDENCE_STORE:false}
  tool-runtime:
    mode: PRODUCTION
    forbid-arbitrary-sql: true
    forbid-arbitrary-shell: true
    forbid-wildcard-rollout: true
  external-local:
    prometheus-enabled: false
    elasticsearch-enabled: false
    mysql-enabled: false
    redis-enabled: false
    docker-enabled: false
  legacy-local-landing:
    mysql-enabled: false
    redis-enabled: false
    docker-enabled: false
  intent:
    llm-classifier:
      enabled: ${OPS_INTENT_LLM_CLASSIFIER_ENABLED:true}
      min-confidence: ${OPS_INTENT_LLM_MIN_CONFIDENCE:0.65}
      context-message-limit: ${OPS_INTENT_CONTEXT_MESSAGE_LIMIT:6}
      context-max-chars: ${OPS_INTENT_CONTEXT_MAX_CHARS:4000}
  memory:
    auto-init: ${OPS_MEMORY_AUTO_INIT:false}
    max-injection-count: ${OPS_MEMORY_MAX_INJECTION_COUNT:8}
    default-ttl: ${OPS_MEMORY_DEFAULT_TTL:PT24H}
  evidence:
    auto-init: ${OPS_EVIDENCE_AUTO_INIT:false}
  task-context:
    auto-init: ${OPS_TASK_CONTEXT_AUTO_INIT:true}
  context-memory:
    auto-init: ${OPS_CONTEXT_MEMORY_AUTO_INIT:true}
  change-package:
    auto-init: ${OPS_CHANGE_PACKAGE_AUTO_INIT:false}
  approved-landing:
    enabled: ${OPS_APPROVED_LANDING_ENABLED:false}
    operation-lease-seconds: ${OPS_LANDING_OPERATION_LEASE_SECONDS:300}
    operation-heartbeat-seconds: ${OPS_LANDING_OPERATION_HEARTBEAT_SECONDS:30}
    recovery:
      enabled: ${OPS_LANDING_RECOVERY_ENABLED:true}
      fixed-delay-ms: ${OPS_LANDING_RECOVERY_FIXED_DELAY_MS:30000}
      batch-size: ${OPS_LANDING_RECOVERY_BATCH_SIZE:20}
  progressive-mcp:
    enforce-project-managed: ${OPS_PROGRESSIVE_MCP_ENFORCE_PROJECT_MANAGED:true}
    disclosure:
      enabled: ${OPS_PROGRESSIVE_MCP_DISCLOSURE_ENABLED:true}
  skill-evolver:
    auto-init: ${OPS_SKILL_EVOLVER_AUTO_INIT:true}
    trigger:
      enabled: ${OPS_SKILL_EVOLVER_TRIGGER_ENABLED:true}
    worker:
      enabled: ${OPS_SKILL_EVOLVER_WORKER_ENABLED:true}
      fixed-delay-ms: ${OPS_SKILL_EVOLVER_WORKER_FIXED_DELAY_MS:60000}
      batch-size: ${OPS_SKILL_EVOLVER_WORKER_BATCH_SIZE:5}
      max-attempts: ${OPS_SKILL_EVOLVER_WORKER_MAX_ATTEMPTS:3}
  skill-evolution:
    enabled: ${OPS_SKILL_EVOLUTION_ENABLED:true}
    shadow:
      enabled: ${OPS_SKILL_EVOLUTION_SHADOW_ENABLED:true}
      min-score: ${OPS_SKILL_EVOLUTION_SHADOW_MIN_SCORE:0.85}
    canary:
      enabled: ${OPS_SKILL_EVOLUTION_CANARY_ENABLED:true}
    canary-percent: ${OPS_SKILL_EVOLUTION_CANARY_PERCENT:10}
    min-sample-size: ${OPS_SKILL_EVOLUTION_MIN_SAMPLE_SIZE:20}
    similarity-threshold: ${OPS_SKILL_EVOLUTION_SIMILARITY_THRESHOLD:0.72}
    promotion:
      min-observations: ${OPS_SKILL_EVOLUTION_MIN_OBSERVATIONS:3}
      explicit-procedure-min-observations: ${OPS_SKILL_EVOLUTION_EXPLICIT_MIN_OBSERVATIONS:2}
      min-distinct-runs: ${OPS_SKILL_EVOLUTION_MIN_DISTINCT_RUNS:2}
      min-distinct-sessions: ${OPS_SKILL_EVOLUTION_MIN_DISTINCT_SESSIONS:2}
      consolidation-sample-limit: ${OPS_SKILL_EVOLUTION_CONSOLIDATION_SAMPLE_LIMIT:12}
    rollback-thresholds:
      blocked-tool-rate: ${OPS_SKILL_EVOLUTION_MAX_BLOCKED_RATE:0.20}
      needs-replan-rate: ${OPS_SKILL_EVOLUTION_MAX_REPLAN_RATE:0.25}
      negative-feedback-rate: ${OPS_SKILL_EVOLUTION_MAX_NEGATIVE_FEEDBACK_RATE:0.15}
      success-rate-drop: ${OPS_SKILL_EVOLUTION_MAX_SUCCESS_RATE_DROP:0.10}
      evidence-rate-drop: ${OPS_SKILL_EVOLUTION_MAX_EVIDENCE_RATE_DROP:0.10}
      tool-call-increase-rate: ${OPS_SKILL_EVOLUTION_MAX_TOOL_CALL_INCREASE_RATE:0.35}
  skill-runtime:
    catalog-candidate-limit: ${OPS_SKILL_RUNTIME_CATALOG_LIMIT:24}
    selected-limit: ${OPS_SKILL_RUNTIME_SELECTED_LIMIT:6}
    max-explicit-skills: ${OPS_SKILL_RUNTIME_MAX_EXPLICIT:12}
    min-relevance-score: ${OPS_SKILL_RUNTIME_MIN_RELEVANCE:0.12}
    similar-suppression-threshold: ${OPS_SKILL_RUNTIME_SIMILAR_THRESHOLD:0.88}
    semantic-enabled: ${OPS_SKILL_RUNTIME_SEMANTIC_ENABLED:true}
    semantic-candidate-limit: ${OPS_SKILL_RUNTIME_SEMANTIC_CANDIDATE_LIMIT:64}
    semantic-recall-limit: ${OPS_SKILL_RUNTIME_SEMANTIC_RECALL_LIMIT:64}
    semantic-weight: ${OPS_SKILL_RUNTIME_SEMANTIC_WEIGHT:0.42}
    category-boost: ${OPS_SKILL_RUNTIME_CATEGORY_BOOST:0.12}
    negative-penalty-weight: ${OPS_SKILL_RUNTIME_NEGATIVE_PENALTY_WEIGHT:0.65}
    llm-rerank-enabled: ${OPS_SKILL_RUNTIME_LLM_RERANK_ENABLED:true}
    llm-rerank-candidate-limit: ${OPS_SKILL_RUNTIME_LLM_RERANK_CANDIDATE_LIMIT:10}
    llm-rerank-weight: ${OPS_SKILL_RUNTIME_LLM_RERANK_WEIGHT:0.35}
    embedding-cache-size: ${OPS_SKILL_RUNTIME_EMBEDDING_CACHE_SIZE:2048}
    catalog-summary-max-chars: ${OPS_SKILL_RUNTIME_CATALOG_SUMMARY_MAX_CHARS:2500}
    max-single-skill-chars: ${OPS_SKILL_RUNTIME_MAX_SINGLE_SKILL_CHARS:4000}
  ai:
    model-calls-enabled: ${OPS_AI_MODEL_CALLS_ENABLED:true}
    placeholder-api-key: ${OPS_AI_PLACEHOLDER_API_KEY:dev-placeholder-key}
    local-model-readiness-cache-ms: ${OPS_AI_LOCAL_MODEL_READINESS_CACHE_MS:10000}
    local-model-readiness-timeout-ms: ${OPS_AI_LOCAL_MODEL_READINESS_TIMEOUT_MS:500}
  multi-agent:
    enabled: ${OPS_MULTI_AGENT_ENABLED:true}
    planner-mode: ${OPS_MULTI_AGENT_PLANNER_MODE:smart}
    planner-llm-enabled: ${OPS_PLANNER_LLM_ENABLED:true}
    main-reflection-llm-enabled: ${OPS_MAIN_REFLECTION_LLM_ENABLED:true}
    sub-agent-llm-enabled: ${OPS_SUB_AGENT_LLM_ENABLED:true}
    reflection-llm-enabled: ${OPS_REFLECTION_LLM_ENABLED:true}
    parallel-execution-enabled: ${OPS_PARALLEL_EXECUTION_ENABLED:true}
    skill-context-enabled: ${OPS_SKILL_CONTEXT_ENABLED:true}
    skill-context-mode: ${OPS_SKILL_CONTEXT_MODE:lazy}
    max-task-executions: ${OPS_MULTI_AGENT_MAX_TASK_EXECUTIONS:8}
    max-adjustments: ${OPS_MULTI_AGENT_MAX_ADJUSTMENTS:3}
    max-evidence-items: ${OPS_MULTI_AGENT_MAX_EVIDENCE_ITEMS:12}
    skill-context-max-chars: ${OPS_SKILL_CONTEXT_MAX_CHARS:12000}
    max-output-chars: ${OPS_MAX_OUTPUT_CHARS:6000}
    model-call-timeout-seconds: ${OPS_MODEL_CALL_TIMEOUT_SECONDS:240}
    fail-on-llm-degradation: ${OPS_FAIL_ON_LLM_DEGRADATION:true}
    json-repair-retry-enabled: ${OPS_JSON_REPAIR_RETRY_ENABLED:true}
    json-response-format-enabled: ${OPS_JSON_RESPONSE_FORMAT_ENABLED:true}
    json-max-completion-tokens: ${OPS_JSON_MAX_COMPLETION_TOKENS:1200}
    json-skill-context-retry-enabled: ${OPS_JSON_SKILL_CONTEXT_RETRY_ENABLED:true}
    json-skill-context-retry-max-chars: ${OPS_JSON_SKILL_CONTEXT_RETRY_MAX_CHARS:16000}
    final-report-llm-enabled: ${OPS_FINAL_REPORT_LLM_ENABLED:true}
    final-report-max-chars: ${OPS_FINAL_REPORT_MAX_CHARS:8000}
    executor:
      core-pool-size: ${OPS_SUB_AGENT_CORE_POOL_SIZE:3}
      max-pool-size: ${OPS_SUB_AGENT_MAX_POOL_SIZE:6}
      queue-capacity: ${OPS_SUB_AGENT_QUEUE_CAPACITY:32}
      keep-alive-seconds: ${OPS_SUB_AGENT_KEEP_ALIVE_SECONDS:30}
      rejection-policy: ${OPS_SUB_AGENT_REJECTION_POLICY:CallerRunsPolicy}
    run-executor:
      core-pool-size: ${OPS_RUN_CORE_POOL_SIZE:2}
      max-pool-size: ${OPS_RUN_MAX_POOL_SIZE:4}
      queue-capacity: ${OPS_RUN_QUEUE_CAPACITY:32}
      keep-alive-seconds: ${OPS_RUN_KEEP_ALIVE_SECONDS:30}
      rejection-policy: ${OPS_RUN_REJECTION_POLICY:CallerRunsPolicy}
    model-call-executor:
      core-pool-size: ${OPS_MODEL_CALL_CORE_POOL_SIZE:4}
      max-pool-size: ${OPS_MODEL_CALL_MAX_POOL_SIZE:8}
      queue-capacity: ${OPS_MODEL_CALL_QUEUE_CAPACITY:32}
      keep-alive-seconds: ${OPS_MODEL_CALL_KEEP_ALIVE_SECONDS:30}
      rejection-policy: ${OPS_MODEL_CALL_REJECTION_POLICY:AbortPolicy}
  graph-events:
    max-memory-events: ${OPS_GRAPH_EVENTS_MAX_MEMORY_EVENTS:500}
    jdbc-enabled: ${OPS_GRAPH_EVENTS_JDBC_ENABLED:true}
    auto-init: ${OPS_GRAPH_EVENTS_AUTO_INIT:false}
  agents:
    locations: ${OPS_AGENT_LOCATIONS:classpath*:/agents/ops/*.yml,classpath*:/agents/ops/*.yaml}
    default-agent-id: ${OPS_AGENT_DEFAULT_ID:generic-ops-react-agent}
    jdbc-enabled: ${OPS_AGENT_DEFINITION_JDBC_ENABLED:true}
    auto-init: ${OPS_AGENT_DEFINITION_AUTO_INIT:false}
  agent:
    action-mode: ${OPS_AGENT_ACTION_MODE:analysis-only}
    enforce-read-only-tools: ${OPS_AGENT_ENFORCE_READ_ONLY_TOOLS:true}
  skills:
    enabled: ${OPS_SKILLS_ENABLED:true}
    locations: ${OPS_SKILLS_LOCATIONS:classpath:/skills}
    editable-location: ${OPS_SKILLS_EDITABLE_LOCATION:./data/skills}
    editable-auto-init: ${OPS_SKILLS_EDITABLE_AUTO_INIT:true}
  mcp:
    cache:
      ttl-seconds: ${OPS_MCP_CACHE_TTL_SECONDS:600}
    security:
      enabled: ${OPS_MCP_SECURITY_ENABLED:true}
      allowed-transports: ${OPS_MCP_ALLOWED_TRANSPORTS:sse,streamable-http}
      allowed-stdio-commands: ${OPS_MCP_ALLOWED_STDIO_COMMANDS:}
      allowed-sse-hosts: ${OPS_MCP_ALLOWED_SSE_HOSTS:}
      allowed-env-keys: ${OPS_MCP_ALLOWED_ENV_KEYS:ES_API_KEY,MYSQL_PASSWORD,POSTGRES_PASSWORD,REDIS_PASSWORD,PROMETHEUS_PASSWORD,RABBITMQ_PASSWORD}
      allowed-header-keys: ${OPS_MCP_ALLOWED_HEADER_KEYS:Authorization,X-API-Key}
      max-timeout-seconds: ${OPS_MCP_MAX_TIMEOUT_SECONDS:60}
  chat:
    stream:
      timeout-ms: ${OPS_CHAT_STREAM_TIMEOUT_MS:360000}
    memory:
      enabled: ${OPS_CHAT_MEMORY_ENABLED:true}
      jdbc-enabled: ${OPS_CHAT_MEMORY_JDBC_ENABLED:true}
      auto-init: ${OPS_CHAT_MEMORY_AUTO_INIT:false}
      hot-store: ${OPS_CHAT_MEMORY_HOT_STORE:memory}
      hot-max-messages: ${OPS_CHAT_MEMORY_HOT_MAX_MESSAGES:12}
      hot-buffer-messages: ${OPS_CHAT_MEMORY_HOT_BUFFER_MESSAGES:24}
      hot-ttl-minutes: ${OPS_CHAT_MEMORY_HOT_TTL_MINUTES:30}
      item-match-limit: ${OPS_CHAT_MEMORY_ITEM_MATCH_LIMIT:8}
      semantic-enabled: ${OPS_CHAT_MEMORY_SEMANTIC_ENABLED:true}
      semantic-top-k: ${OPS_CHAT_MEMORY_SEMANTIC_TOP_K:8}
      context-max-chars: ${OPS_CHAT_MEMORY_CONTEXT_MAX_CHARS:8000}
      assemble-timeout-millis: ${OPS_CHAT_MEMORY_ASSEMBLE_TIMEOUT_MILLIS:1200}
      recency-aware-enabled: ${OPS_CHAT_MEMORY_RECENCY_AWARE_ENABLED:true}
      recency-half-life-turns: ${OPS_CHAT_MEMORY_RECENCY_HALF_LIFE_TURNS:6}
      extraction-enabled: ${OPS_CHAT_MEMORY_EXTRACTION_ENABLED:true}
      llm-extraction-enabled: ${OPS_CHAT_MEMORY_LLM_EXTRACTION_ENABLED:true}
      llm-extraction-max-input-chars: ${OPS_CHAT_MEMORY_LLM_EXTRACTION_MAX_INPUT_CHARS:4000}
      extraction-max-items-per-message: ${OPS_CHAT_MEMORY_EXTRACTION_MAX_ITEMS_PER_MESSAGE:6}
      compression-enabled: ${OPS_CHAT_MEMORY_COMPRESSION_ENABLED:true}
      compression-hot-threshold-messages: ${OPS_CHAT_MEMORY_COMPRESSION_HOT_THRESHOLD_MESSAGES:20}
      compression-keep-recent: ${OPS_CHAT_MEMORY_COMPRESSION_KEEP_RECENT:8}
      compression-llm-enabled: ${OPS_CHAT_MEMORY_COMPRESSION_LLM_ENABLED:true}
      compression-llm-max-input-chars: ${OPS_CHAT_MEMORY_COMPRESSION_LLM_MAX_INPUT_CHARS:6000}
      executor:
        core-pool-size: ${OPS_CHAT_MEMORY_CORE_POOL_SIZE:3}
        max-pool-size: ${OPS_CHAT_MEMORY_MAX_POOL_SIZE:5}
        queue-capacity: ${OPS_CHAT_MEMORY_QUEUE_CAPACITY:64}
        keep-alive-seconds: ${OPS_CHAT_MEMORY_KEEP_ALIVE_SECONDS:30}
        rejection-policy: ${OPS_CHAT_MEMORY_REJECTION_POLICY:CallerRunsPolicy}
  elasticsearch-url: ${OPS_ES_URL}
  elasticsearch-index: ${OPS_ES_INDEX:}
  elasticsearch-timeout-seconds: ${OPS_ES_TIMEOUT_SECONDS:5}
  elasticsearch-sample-size: ${OPS_ES_SAMPLE_SIZE:8}
  prometheus-url: ${OPS_PROMETHEUS_URL}
  prometheus-job: ${OPS_PROMETHEUS_JOB:}
  prometheus-timeout-seconds: ${OPS_PROMETHEUS_TIMEOUT_SECONDS:5}
  allowed-origin-patterns: ${OPS_ALLOWED_ORIGIN_PATTERNS}
  audit:
    max-records: ${OPS_AUDIT_MAX_RECORDS:200}
    jdbc-enabled: ${OPS_AUDIT_JDBC_ENABLED:true}
    auto-init: ${OPS_AUDIT_AUTO_INIT:false}
  runs:
    max-memory-records: ${OPS_RUN_MAX_MEMORY_RECORDS:200}
    jdbc-enabled: ${OPS_RUN_JDBC_ENABLED:true}
    auto-init: ${OPS_RUN_AUTO_INIT:false}
    reject-when-queue-full: ${OPS_RUN_REJECT_WHEN_QUEUE_FULL:true}
    allow-in-memory-fallback: ${OPS_RUN_ALLOW_IN_MEMORY_FALLBACK:false}
  source-repository:
    enabled: ${OPS_SOURCE_REPOSITORY_ENABLED:false}
    jdbc-enabled: ${OPS_SOURCE_REPOSITORY_JDBC_ENABLED:true}
    auto-init: ${OPS_SOURCE_REPOSITORY_AUTO_INIT:false}
    allowed-local-roots: ${OPS_SOURCE_ALLOWED_LOCAL_ROOTS:}
    git-binary: ${OPS_SOURCE_GIT_BINARY:git}
    command-timeout-seconds: ${OPS_SOURCE_COMMAND_TIMEOUT_SECONDS:8}
    max-file-bytes: ${OPS_SOURCE_MAX_FILE_BYTES:1048576}
    max-command-output-bytes: ${OPS_SOURCE_MAX_COMMAND_OUTPUT_BYTES:2097152}
  execution-resource:
    enabled: ${OPS_EXECUTION_RESOURCE_ENABLED:true}
    jdbc-enabled: ${OPS_EXECUTION_RESOURCE_JDBC_ENABLED:true}
    auto-init: ${OPS_EXECUTION_RESOURCE_AUTO_INIT:false}
  model-api-bootstrap:
    enabled: ${OPS_MODEL_API_BOOTSTRAP_ENABLED:false}
    api-id: ${OPS_MODEL_API_BOOTSTRAP_API_ID:1001}
  repair:
    enabled: ${OPS_REPAIR_ENABLED:false}
    jdbc-enabled: ${OPS_REPAIR_JDBC_ENABLED:true}
    auto-init: ${OPS_REPAIR_AUTO_INIT:false}
    worktree-root: ${OPS_REPAIR_WORKTREE_ROOT:${OPS_REPAIR_SANDBOX_ROOT:/var/lib/orbisops/repair/worktrees}}
    artifact-root: ${OPS_REPAIR_ARTIFACT_ROOT:/var/lib/orbisops/repair/artifacts}
    release-root: ${OPS_REPAIR_RELEASE_ROOT:/var/lib/orbisops/repair/releases}
    command-timeout-seconds: ${OPS_REPAIR_COMMAND_TIMEOUT_SECONDS:900}
    max-log-bytes: ${OPS_REPAIR_MAX_LOG_BYTES:1048576}
    runner: ${OPS_REPAIR_RUNNER:docker}
    docker:
      binary: ${OPS_REPAIR_DOCKER_BINARY:docker}
      maven-image: ${OPS_REPAIR_DOCKER_MAVEN_IMAGE:maven:3.9.9-eclipse-temurin-17}
      node-image: ${OPS_REPAIR_DOCKER_NODE_IMAGE:node:20-bookworm-slim}
      make-image: ${OPS_REPAIR_DOCKER_MAKE_IMAGE:buildpack-deps:bookworm}
    github:
      enabled: ${OPS_REPAIR_GITHUB_ENABLED:false}
      repository: ${OPS_REPAIR_GITHUB_REPOSITORY:}
      api-url: ${OPS_REPAIR_GITHUB_API_URL:https://api.github.com}
      token-ref: ${OPS_REPAIR_GITHUB_TOKEN_REF:}
      remote: ${OPS_REPAIR_GITHUB_REMOTE:origin}
  alert-triggers:
    auto-init: ${OPS_ALERT_TRIGGER_AUTO_INIT:false}
    signature-max-skew-seconds: ${OPS_ALERT_TRIGGER_SIGNATURE_MAX_SKEW_SECONDS:300}
    aggregation:
      debounce-seconds: ${OPS_ALERT_AGGREGATION_DEBOUNCE_SECONDS:120}
      max-wait-seconds: ${OPS_ALERT_AGGREGATION_MAX_WAIT_SECONDS:900}
    project-queue:
      max-queued: ${OPS_ALERT_PROJECT_MAX_QUEUED:100}
      max-running: ${OPS_ALERT_PROJECT_MAX_RUNNING:4}
    outbox:
      enabled: ${OPS_ALERT_TRIGGER_OUTBOX_ENABLED:true}
      fixed-delay-ms: ${OPS_ALERT_TRIGGER_OUTBOX_FIXED_DELAY_MS:30000}
      batch-size: ${OPS_ALERT_TRIGGER_OUTBOX_BATCH_SIZE:20}
      max-attempts: ${OPS_ALERT_TRIGGER_OUTBOX_MAX_ATTEMPTS:8}
      lock-timeout-seconds: ${OPS_ALERT_TRIGGER_OUTBOX_LOCK_TIMEOUT_SECONDS:120}
  channel:
    inbound:
      max-message-chars: ${OPS_CHANNEL_INBOUND_MAX_MESSAGE_CHARS:12000}
      max-metadata-chars: ${OPS_CHANNEL_INBOUND_MAX_METADATA_CHARS:8192}
      lease-seconds: ${OPS_CHANNEL_INBOUND_LEASE_SECONDS:300}
      worker:
        enabled: ${OPS_CHANNEL_INBOUND_WORKER_ENABLED:true}
        fixed-delay-ms: ${OPS_CHANNEL_INBOUND_WORKER_FIXED_DELAY_MS:5000}
        batch-size: ${OPS_CHANNEL_INBOUND_WORKER_BATCH_SIZE:20}
    outbound:
      max-message-chars: ${OPS_CHANNEL_OUTBOUND_MAX_MESSAGE_CHARS:20000}
    auto-init: ${OPS_CHANNEL_AUTO_INIT:false}
    webhook:
      max-clock-skew-seconds: ${OPS_CHANNEL_WEBHOOK_MAX_CLOCK_SKEW_SECONDS:300}
      allow-loopback: ${OPS_CHANNEL_WEBHOOK_ALLOW_LOOPBACK:false}
      allowed-hosts: ${OPS_CHANNEL_WEBHOOK_ALLOWED_HOSTS:}
    notification:
      max-message-chars: ${OPS_CHANNEL_NOTIFICATION_MAX_MESSAGE_CHARS:12000}
      outbox:
        auto-init: ${OPS_CHANNEL_NOTIFICATION_OUTBOX_AUTO_INIT:false}
        scheduler-enabled: ${OPS_CHANNEL_NOTIFICATION_OUTBOX_SCHEDULER_ENABLED:true}
        batch-size: ${OPS_CHANNEL_NOTIFICATION_OUTBOX_BATCH_SIZE:20}
        fixed-delay-ms: ${OPS_CHANNEL_NOTIFICATION_OUTBOX_FIXED_DELAY_MS:60000}
        max-attempts: ${OPS_CHANNEL_NOTIFICATION_OUTBOX_MAX_ATTEMPTS:8}
        lease-seconds: ${OPS_CHANNEL_NOTIFICATION_OUTBOX_LEASE_SECONDS:120}
  rag:
    vector-table-name: ${OPS_RAG_VECTOR_TABLE_NAME:vector_store_qwen_vl_2048}
    vector-index:
      auto-init: ${OPS_RAG_VECTOR_INDEX_AUTO_INIT:true}
    query-rewrite:
      mode: ${OPS_RAG_QUERY_REWRITE_MODE:hybrid}
      llm-enabled: ${OPS_RAG_QUERY_REWRITE_LLM_ENABLED:true}
      base-url: ${OPS_RAG_QUERY_REWRITE_BASE_URL:${spring.ai.openai.base-url}}
      api-key: ${OPS_RAG_QUERY_REWRITE_API_KEY:${spring.ai.openai.api-key}}
      path: ${OPS_RAG_QUERY_REWRITE_PATH:v1/chat/completions}
      model: ${OPS_RAG_QUERY_REWRITE_MODEL:${spring.ai.openai.chat.options.model:gpt-5.4-mini}}
      max-queries: ${OPS_RAG_QUERY_REWRITE_MAX_QUERIES:4}
      timeout-seconds: ${OPS_RAG_QUERY_REWRITE_TIMEOUT_SECONDS:45}
      min-chars: ${OPS_RAG_QUERY_REWRITE_MIN_CHARS:18}
      on-low-recall: ${OPS_RAG_QUERY_REWRITE_ON_LOW_RECALL:true}
      low-recall-min-candidates: ${OPS_RAG_QUERY_REWRITE_LOW_RECALL_MIN_CANDIDATES:2}
    ttft:
      optimize-streaming: ${OPS_RAG_TTFT_OPTIMIZE_STREAMING:true}
      disable-rerank-on-stream: ${OPS_RAG_TTFT_DISABLE_RERANK_ON_STREAM:true}
      vector-top-k: ${OPS_RAG_TTFT_VECTOR_TOP_K:4}
      bm25-top-k: ${OPS_RAG_TTFT_BM25_TOP_K:6}
      final-top-k: ${OPS_RAG_TTFT_FINAL_TOP_K:4}
      query-rewrite-enabled: ${OPS_RAG_TTFT_QUERY_REWRITE_ENABLED:true}
    ingestion:
      jdbc-enabled: ${OPS_RAG_INGESTION_JDBC_ENABLED:true}
      auto-init: ${OPS_RAG_INGESTION_AUTO_INIT:false}
      max-file-count: ${OPS_RAG_INGESTION_MAX_FILE_COUNT:20}
      max-file-bytes: ${OPS_RAG_INGESTION_MAX_FILE_BYTES:52428800}
      max-total-bytes: ${OPS_RAG_INGESTION_MAX_TOTAL_BYTES:209715200}
      allowed-extensions: ${OPS_RAG_INGESTION_ALLOWED_EXTENSIONS:md,markdown,pdf}
      allowed-content-types: ${OPS_RAG_INGESTION_ALLOWED_CONTENT_TYPES:text/markdown,text/plain,application/pdf,application/octet-stream}
      executor:
        core-pool-size: ${OPS_RAG_INGESTION_CORE_POOL_SIZE:1}
        max-pool-size: ${OPS_RAG_INGESTION_MAX_POOL_SIZE:2}
        queue-capacity: ${OPS_RAG_INGESTION_QUEUE_CAPACITY:16}
        keep-alive-seconds: ${OPS_RAG_INGESTION_KEEP_ALIVE_SECONDS:30}
        rejection-policy: ${OPS_RAG_INGESTION_REJECTION_POLICY:CallerRunsPolicy}
    multimodal:
      enabled: ${OPS_RAG_MULTIMODAL_ENABLED:false}
      provider: ${OPS_RAG_MULTIMODAL_PROVIDER:qwen-vl}
      base-url: ${OPS_RAG_MULTIMODAL_BASE_URL:http://127.0.0.1:8110}
      api-key: ${OPS_RAG_MULTIMODAL_API_KEY:local-rag-models}
      path: ${OPS_RAG_MULTIMODAL_PATH:v1/multimodalembeddings}
      model: ${OPS_RAG_MULTIMODAL_MODEL:Qwen/Qwen3-VL-Embedding-2B}
      table-name: ${OPS_RAG_MULTIMODAL_TABLE_NAME:vector_store_qwen_vl_multimodal}
      dimension: ${OPS_RAG_MULTIMODAL_DIMENSION:2048}
      auto-init: ${OPS_RAG_MULTIMODAL_AUTO_INIT:true}
      index-text-documents: ${OPS_RAG_MULTIMODAL_INDEX_TEXT_DOCUMENTS:false}
      index-original-media: ${OPS_RAG_MULTIMODAL_INDEX_ORIGINAL_MEDIA:true}
      index-pdf-page-images: ${OPS_RAG_MULTIMODAL_INDEX_PDF_PAGE_IMAGES:true}
      max-pdf-pages: ${OPS_RAG_MULTIMODAL_MAX_PDF_PAGES:3}
      pdf-render-dpi: ${OPS_RAG_MULTIMODAL_PDF_RENDER_DPI:144}
      max-image-bytes: ${OPS_RAG_MULTIMODAL_MAX_IMAGE_BYTES:20971520}
      max-text-chars: ${OPS_RAG_MULTIMODAL_MAX_TEXT_CHARS:3000}
      search-top-k: ${OPS_RAG_MULTIMODAL_SEARCH_TOP_K:8}
      timeout-seconds: ${OPS_RAG_MULTIMODAL_TIMEOUT_SECONDS:30}
      max-retries: ${OPS_RAG_MULTIMODAL_MAX_RETRIES:1}
    parse:
      max-chunk-chars: ${OPS_RAG_PARSE_MAX_CHUNK_CHARS:3000}
      visual-min-text-chars: ${OPS_RAG_PARSE_VISUAL_MIN_TEXT_CHARS:120}
      media-storage-dir: ${OPS_RAG_PARSE_MEDIA_STORAGE_DIR:data/rag-media}
      max-pdf-images: ${OPS_RAG_PARSE_MAX_PDF_IMAGES:20}
      visual:
        enabled: ${OPS_RAG_VISUAL_ENABLED:false}
        high-value-only: ${OPS_RAG_VISUAL_HIGH_VALUE_ONLY:true}
        provider: ${OPS_RAG_VISUAL_PROVIDER:openai}
        base-url: ${OPS_RAG_VISUAL_BASE_URL:${spring.ai.openai.base-url}}
        api-key: ${OPS_RAG_VISUAL_API_KEY:${spring.ai.openai.api-key}}
        path: ${OPS_RAG_VISUAL_PATH:v1/chat/completions}
        model: ${OPS_RAG_VISUAL_MODEL:gpt-5.4-mini}
        detail: ${OPS_RAG_VISUAL_DETAIL:low}
        timeout-seconds: ${OPS_RAG_VISUAL_TIMEOUT_SECONDS:30}
        max-completion-tokens: ${OPS_RAG_VISUAL_MAX_COMPLETION_TOKENS:1200}
        token-limit-field: ${OPS_RAG_VISUAL_TOKEN_LIMIT_FIELD:max_completion_tokens}
        response-format: ${OPS_RAG_VISUAL_RESPONSE_FORMAT:json_schema}
        max-retries: ${OPS_RAG_VISUAL_MAX_RETRIES:1}
        max-images-per-document: ${OPS_RAG_VISUAL_MAX_IMAGES_PER_DOCUMENT:3}
        max-image-bytes: ${OPS_RAG_VISUAL_MAX_IMAGE_BYTES:4194304}
        pdf-render-dpi: ${OPS_RAG_VISUAL_PDF_RENDER_DPI:144}
    rerank:
      enabled: ${OPS_RERANK_ENABLED:true}
      provider: ${OPS_RERANK_PROVIDER:cohere}
      base-url: ${OPS_RERANK_BASE_URL:http://127.0.0.1:8110}
      api-key: ${OPS_RERANK_API_KEY:local-rag-models}
      path: ${OPS_RERANK_PATH:v1/rerank}
      model: ${OPS_RERANK_MODEL:Qwen/Qwen3-VL-Reranker-2B}
      candidate-top-k: ${OPS_RERANK_CANDIDATE_TOP_K:20}
      top-n: ${OPS_RERANK_TOP_N:6}
      max-doc-chars: ${OPS_RERANK_MAX_DOC_CHARS:1200}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
  endpoint:
    health:
      probes:
      enabled: true
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
  metrics:
    tags:
      application: ${MANAGEMENT_METRICS_TAG_APPLICATION:orbisops}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:info}
    cn.lgs.orbisops: ${LOGGING_LEVEL_APP:info}
  config: classpath:logback-spring.xml
