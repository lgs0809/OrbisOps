name: Server CI

on:
  push:
    paths:
      - "server/**"
      - "Makefile"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "Makefile"
      - ".github/workflows/server-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Release hygiene
        run: python3 scripts/release-hygiene.py

      - name: Check migration script
        run: bash -n scripts/db-migrate.sh

      - name: Check bundled MCP servers
        run: |
          for file in scripts/mcp/*.mjs; do
            node --check "$file"
          done

      - name: Test
        run: mvn -B test
