name: Web CI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "Makefile"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "Makefile"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Repository release hygiene
        working-directory: ${{ github.workspace }}
        run: python3 scripts/release-hygiene.py

      - name: Install Playwright Chrome
        run: npx playwright install --with-deps chrome

      - name: Verify
        run: npm run verify

      - name: Product acceptance
        run: npm run test:e2e

      - name: Retain failed browser test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-evidence-${{ github.run_id }}
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build container image
        run: docker build --load -t orbisops/web:ci .

      - name: Smoke web container
        run: docker run --rm --entrypoint sh orbisops/web:ci -c 'nginx -t && test -f /usr/share/nginx/html/index.html'
